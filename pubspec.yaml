name: campus_connect
description: "CampusConnect: a cross-platform campus community application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.7.1
  connectivity_plus: ^7.3.1
  file_picker: ^11.0.2
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_storage: ^13.4.5
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.2.0
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.3.0
  fluttertoast: ^9.1.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  lottie: ^3.5.1
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true